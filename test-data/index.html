<script>
// Every JSON file under test-data/, by its path on disk. This page only reads them.
const FILES = JSON.parse(document.getElementById("files").textContent);
const PATHS = Object.keys(FILES).sort();
const AUDIT = new Set(["Version","CreatedAt","CreatedBy","IsDeleted","LastModified","LastModifiedBy","ConcurrencyStamp","SecurityStamp","PasswordHash"]);
let query = "", showAudit = false, raw = false;
const esc = (v) => String(v).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ref → the file and row that holds it, so a reference opens where it lives.
const REF = {};
for (const p of PATHS) walkItems(FILES[p], (item) => { if (item && item.ref && !REF[item.ref]) REF[item.ref] = p; });
function walkItems(v, f) { if (Array.isArray(v)) v.forEach((x) => { f(x); }); else if (v && typeof v === "object") Object.values(v).forEach((x) => Array.isArray(x) && x.forEach(f)); }

function count(v) {
  if (Array.isArray(v)) return v.length;
  const lists = Object.values(v || {}).filter((l) => Array.isArray(l) && (!l.length || typeof l[0] === "object"));
  return lists.length ? lists.reduce((n, l) => n + l.length, 0) : "";
}

function tree() {
  const root = {};
  for (const p of PATHS) {
    if (query && !p.toLowerCase().includes(query) && !JSON.stringify(FILES[p]).toLowerCase().includes(query)) continue;
    let node = root;
    const parts = p.split("/");
    parts.slice(0, -1).forEach((d) => (node = node[d] = node[d] || {}));
    node[parts[parts.length - 1]] = p;
  }
  const cur = decodeURIComponent(location.hash.slice(1).split("#")[0]);
  const ORDER = ["http", "domain", "unit", "database", "ui", "flows", "errors", "exports", "vocabulary"];
  const rank = (k) => (ORDER.indexOf(k) + 1) || 99;
  const render = (node, depth) => Object.keys(node).sort((a, b) => (typeof node[a] === "string") - (typeof node[b] === "string") || rank(a) - rank(b) || a.localeCompare(b)).map((k) => {
    if (typeof node[k] === "string") return `<a href="#${encodeURIComponent(node[k])}" class="${node[k] === cur ? "on" : ""}">${esc(k)}<span>${count(FILES[node[k]])}</span></a>`;
    const open = (depth === 0 && ["http", "database"].includes(k)) || cur.startsWith(pathOf(node[k]) || "\u0000") || !!query;
    const ix = node[k]["index.json"];
    const label = ix ? `<a class="dir" href="#${encodeURIComponent(ix)}">${esc(k)}/</a>` : `${esc(k)}/`;
    return `<details ${open ? "open" : ""}><summary>${label}</summary><div class="kids">${render(node[k], depth + 1)}</div></details>`;
  }).join("");
  document.getElementById("tree").innerHTML = render(root, 0);
}
function pathOf(node) { for (const v of Object.values(node)) { if (typeof v === "string") return v.split("/").slice(0, -1).join("/"); const p = pathOf(v); if (p) return p.split("/").slice(0, -1).join("/"); } return ""; }

let CUR_DIR = "";
function cell(v, col) {
  if (v === null || v === undefined) return `<td class="null">null</td>`;
  if (col === "file" && typeof v === "string" && FILES[CUR_DIR + v]) return `<td><a class="ref" href="#${encodeURIComponent(CUR_DIR + v)}">${esc(v)}</a></td>`;
  if (col === "folder" && typeof v === "string" && FILES[CUR_DIR + v + "index.json"]) return `<td><a class="ref" href="#${encodeURIComponent(CUR_DIR + v + "index.json")}">${esc(v)}</a></td>`;
  if (typeof v === "string" && REF[v]) return `<td><a class="ref" href="#${encodeURIComponent(REF[v])}#${encodeURIComponent(v)}">${esc(v)}</a></td>`;
  if (typeof v === "object") return `<td>${esc(JSON.stringify(v))}</td>`;
  return `<td>${esc(v)}</td>`;
}

// A list of items as a table: an item's `data` spread into columns, its other
// scalar fields (ref, kind, case, field, rule, expect…) as the leading columns.
function table(list, target) {
  if (!list.length) return `<p class="meta">Empty.</p>`;
  const flat = list.map((i) => {
    if (!i || typeof i !== "object") return { value: i };
    const row = {};
    for (const [k, v] of Object.entries(i)) {
      if (k === "data" || k === "body" || k === "values") Object.assign(row, v);
      else if (k === "links") continue;
      else if (v && typeof v === "object" && !Array.isArray(v)) for (const [k2, v2] of Object.entries(v)) row[`${k}.${k2}`] = v2;
      else row[k] = v;
    }
    if (i.links) for (const [k, ref] of Object.entries(i.links)) row[k] = ref;
    return row;
  });
  const cols = [...new Set(flat.flatMap(Object.keys))].filter((c) => showAudit || !AUDIT.has(c));
  const rows = flat.filter((r) => !query || JSON.stringify(r).toLowerCase().includes(query));
  let h = `<div class="meta">${rows.length} of ${list.length} · <span class="toggle" id="aud">${showAudit ? "hide" : "show"} audit columns</span></div><div class="wrap"><table><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr>`;
  for (const r of rows) h += `<tr id="${esc(r.ref || "")}" class="${r.ref && r.ref === target ? "hit" : ""}">${cols.map((c) => cell(r[c], c)).join("")}</tr>`;
  return h + `</table></div>`;
}

function view(path, target) {
  const v = FILES[path];
  CUR_DIR = path.includes("/") ? path.slice(0, path.lastIndexOf("/") + 1) : "";
  const parts = path.split("/");
  let h = `<div class="crumbs mono">test-data / ${parts.map(esc).join(" / ")}</div><h1>${esc(parts[parts.length - 1])}</h1>`;
  h += `<div class="tabs"><button id="t-table" class="${raw ? "" : "on"}">Table</button> <button id="t-raw" class="${raw ? "on" : ""}">JSON</button></div>`;
  if (raw) return h + `<pre>${esc(JSON.stringify(v, null, 2))}</pre>`;
  if (Array.isArray(v)) return h + table(v, target);
  const scalars = Object.entries(v).filter(([, x]) => x === null || typeof x !== "object");
  const nested = Object.entries(v).filter(([, x]) => x && typeof x === "object");
  if (scalars.length) h += `<dl class="fields">${scalars.map(([k, x]) => `<dt>${esc(k)}</dt><dd class="mono">${esc(x ?? "null")}</dd>`).join("")}</dl>`;
  for (const [k, x] of nested) {
    if (Array.isArray(x) && x.length && typeof x[0] === "object") h += `<h2>${esc(k)} <span>${x.length}</span></h2>` + table(x, target);
    else if (Array.isArray(x)) h += `<h2>${esc(k)} <span>${x.length}</span></h2><p class="mono">${esc(x.join(" · "))}</p>`;
    else h += `<h2>${esc(k)}</h2><pre>${esc(JSON.stringify(x, null, 2))}</pre>`;
  }
  return h;
}

function home() {
  const ix = FILES["index.json"] || {};
  const model = ix.model || [];
  let h = `<h1>${esc(ix.domain || "test-data")}</h1><p class="meta">${esc(ix.repository || "")} · ${ix.rows ?? ""} rows, ${ix.matches_report ? "matching" : "NOT matching"} the generation report · coverage ${esc(ix.coverage || "")}</p>`;
  const layers = [...new Set(model.map((m) => m.layer))];
  h += `<div class="wrap home"><table><tr><th>layer</th><th>item</th><th>valid</th><th>invalid</th><th>coverage</th><th>other</th></tr>`;
  for (const layer of layers) {
    for (const m of model.filter((x) => x.layer === layer && (!query || JSON.stringify(x).toLowerCase().includes(query)))) {
      const other = Object.entries(m).filter(([k]) => !["layer", "item", "file", "valid", "invalid", "coverage"].includes(k)).map(([k, v]) => `${k} ${v}`).join(" · ");
      h += `<tr><td>${esc(layer)}</td><td class="mono"><a class="ref" href="#${encodeURIComponent(m.file)}">${esc(m.item)}</a></td><td>${m.valid ?? ""}</td><td>${m.invalid ?? ""}</td><td>${m.coverage ?? ""}</td><td>${esc(other)}</td></tr>`;
    }
  }
  return h + `</table></div>`;
}

function render() {
  const [path, target] = location.hash.slice(1).split("#").map(decodeURIComponent);
  tree();
  document.getElementById("main").innerHTML = FILES[path] ? view(path, target) : home();
  const a = document.getElementById("aud"); if (a) a.onclick = () => { showAudit = !showAudit; render(); };
  const t = document.getElementById("t-table"), r = document.getElementById("t-raw");
  if (t) t.onclick = () => { raw = false; render(); };
  if (r) r.onclick = () => { raw = true; render(); };
  if (target) { const el = document.getElementById(target); if (el) el.scrollIntoView({ block: "center" }); }
}
document.getElementById("q").oninput = (e) => { query = e.target.value.toLowerCase(); render(); };
window.onhashchange = render;
render();
</script>
</body>
</html>
